spring:
  application:
    name: smartfactory

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartfactory_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:c21hcnRmYWN0b3J5and0c2VjcmV0a2V5Zm9ydGVzdGluZ29ubHltdXN0YmVjaGFuZ2VkaW4=}
  expiration: ${JWT_EXPIRATION:86400000}

simulation:
  speed-multiplier: ${SIMULATION_SPEED:20}
  tick-interval-ms: ${SIMULATION_TICK_MS:500}
  mode: ${SIMULATION_MODE:DEMO}

logging:
  level:
    root: INFO
    com.smartfactory: DEBUG
    org.flywaydb: INFO
    com.smartfactory.security: DEBUG
